# PJA110 MTP responder 配置
#
# 替换 Debian 包默认值（原来指向 /var/lib/umtp 的 "shared folder"）。
# 现在暴露用户目录下的 Shared，与手机上看到的是同一批文件。

# ---- 存储 ----
# 语法：storage "PATH" "NAME" "FLAGS"
storage "/home/ubuntu/Shared" "Shared" "rw"

# ---- 设备字符串（PC 上显示的名字）----
manufacturer "OnePlus"
product "PJA110"
serial "PJA110"
firmware_version "1.0"
interface "MTP"

# ---- USB 标识 ----
# 0x1D6B = Linux Foundation；0x0100 = PTP/MTP gadget
usb_vendor_id  0x1D6B
usb_product_id 0x0100
usb_class    0x6      # Image
usb_subclass 0x1      # Still Imaging
usb_protocol 0x1
usb_dev_version 0x3008

# ---- FunctionFS 模式 ----
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200

# 主机断开后重新等待连接
loop_on_disconnect 1
