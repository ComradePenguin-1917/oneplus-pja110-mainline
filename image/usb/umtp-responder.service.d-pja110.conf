# PJA110：覆盖 Debian 打包的 umtp-responder.service
#
# 两个原因：
#   1. 打包的 ExecStart 是 /usr/sbin/umtprd-ffs —— 一个示例脚本，
#      它自己建 gadget 然后 `umtprd &` 就退出，systemd 会认为服务挂了。
#      我们要的是前台运行 /usr/bin/umtprd。
#   2. 打包的沙箱（PrivateUsers / ProtectHome / ProtectSystem）会让
#      /home/ubuntu/Shared 里的文件在服务命名空间里变成 nobody，
#      MTP 读写会出问题。单用户设备不需要这层隔离。

[Unit]
# 必须先由 gadget 单元把 functionfs 挂到 /dev/ffs-mtp
After=pja110-usb-gadget.service

[Service]
# 前台运行，由 systemd 托管
ExecStart=
ExecStart=/usr/bin/umtprd

# 去掉沙箱
#   PrivateDevices=yes 会给服务一个私有 /dev，
#   于是 /dev/ffs-mtp/ep0 在服务命名空间里不存在 →
#   "Unable to open /dev/ffs-mtp/ep0 (No such file or directory)"
PrivateDevices=no
PrivateUsers=no
ProtectHome=no
ProtectSystem=no
ProtectKernelTunables=no
ProtectKernelModules=no
NoNewPrivileges=no
RestrictNamespaces=no
ReadOnlyDirectories=
ReadWriteDirectories=

# 断线重连后自动恢复
Restart=always
RestartSec=2
